name: preco-confirmado-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preco_confirmado}
      POSTGRES_USER: ${DATABASE_USERNAME:-preco_confirmado}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-preco_confirmado_dev}
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - preco_confirmado_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-preco_confirmado} -d ${POSTGRES_DB:-preco_confirmado}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-preco_confirmado}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-preco_confirmado}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-preco_confirmado_dev}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-PT15M}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-P7D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      MONITORING_BATCH_SIZE: ${MONITORING_BATCH_SIZE:-50}
      MONITORING_SCHEDULER_DELAY: ${MONITORING_SCHEDULER_DELAY:-PT60S}
      VERIFICATION_RECHECK_DELAY: ${VERIFICATION_RECHECK_DELAY:-PT2M}
      ALERT_DUPLICATE_COOLDOWN: ${ALERT_DUPLICATE_COOLDOWN:-PT24H}
      ALERT_MINIMUM_ADDITIONAL_DROP_PERCENT: ${ALERT_MINIMUM_ADDITIONAL_DROP_PERCENT:-5}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-LOG}
      NOTIFICATION_SCHEDULER_DELAY: ${NOTIFICATION_SCHEDULER_DELAY:-PT30S}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@preco-confirmado.local}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MERCADO_LIVRE_ENABLED: ${MERCADO_LIVRE_ENABLED:-false}
      MERCADO_LIVRE_BASE_URL: ${MERCADO_LIVRE_BASE_URL:-https://api.mercadolibre.com}
      MERCADO_LIVRE_ACCESS_TOKEN: ${MERCADO_LIVRE_ACCESS_TOKEN:-}
      MERCADO_LIVRE_CONNECT_TIMEOUT: ${MERCADO_LIVRE_CONNECT_TIMEOUT:-PT5S}
      MERCADO_LIVRE_READ_TIMEOUT: ${MERCADO_LIVRE_READ_TIMEOUT:-PT10S}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-Development Admin}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - preco_confirmado_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  preco_confirmado_network:
    driver: bridge
