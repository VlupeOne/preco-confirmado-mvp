server:
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  scalar:
    enabled: ${OPENAPI_UI_ENABLED:false}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
