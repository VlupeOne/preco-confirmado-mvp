spring:
  application:
    name: preco-confirmado-backend
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via_dto
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/preco_confirmado}
    username: ${DATABASE_USERNAME:preco_confirmado}
    password: ${DATABASE_PASSWORD:preco_confirmado}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: preco-confirmado-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 20s
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    batch-size: ${MONITORING_BATCH_SIZE:50}
    scheduler-delay: ${MONITORING_SCHEDULER_DELAY:PT60S}
    verification-recheck-delay: ${VERIFICATION_RECHECK_DELAY:PT2M}
  alerts:
    duplicate-cooldown: ${ALERT_DUPLICATE_COOLDOWN:PT24H}
    minimum-additional-drop-percent: ${ALERT_MINIMUM_ADDITIONAL_DROP_PERCENT:5}
  notifications:
    channel: ${NOTIFICATION_CHANNEL:LOG}
    mail-from: ${MAIL_FROM:no-reply@preco-confirmado.local}
    max-attempts: 5
    scheduler-delay: ${NOTIFICATION_SCHEDULER_DELAY:PT30S}
  mercado-livre:
    enabled: ${MERCADO_LIVRE_ENABLED:false}
    base-url: ${MERCADO_LIVRE_BASE_URL:https://api.mercadolibre.com}
    access-token: ${MERCADO_LIVRE_ACCESS_TOKEN:}
    connect-timeout: ${MERCADO_LIVRE_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${MERCADO_LIVRE_READ_TIMEOUT:PT10S}
